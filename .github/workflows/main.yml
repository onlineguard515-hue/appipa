name: 🍎 Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    
    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🔨 Compile iOS Binary & Package IPA
        run: |
          mkdir -p Payload/KurdExpenseApp.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Compile Real Apple ARM64 Executable
          xcrun clang -target arm64-apple-ios14.0 -isysroot "$SDK_PATH" -framework UIKit -framework Foundation -o Payload/KurdExpenseApp.app/KurdExpenseApp -x objective-c - <<< '#import <UIKit/UIKit.h>
          int main(int argc, char * argv[]) { @autoreleasepool { return UIApplicationMain(argc, argv, nil, nil); } }'
          
          chmod +x Payload/KurdExpenseApp.app/KurdExpenseApp
          
          # Copy Info.plist
          if [ -f "ipa_build/Payload/KurdExpenseApp.app/Info.plist" ]; then
            cp "ipa_build/Payload/KurdExpenseApp.app/Info.plist" Payload/KurdExpenseApp.app/
          else
            find . -name "Info.plist" -exec cp {} Payload/KurdExpenseApp.app/ \; 2>/dev/null || true
          fi
          
          # Zip into IPA
          zip -r KurdExpenseApp.ipa Payload

      - name: 📤 Upload Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: KurdExpenseApp-iOS-IPA
          path: KurdExpenseApp.ipa
          retention-days: 14
