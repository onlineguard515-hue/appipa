name: 🍎 Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    
    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: 📦 Build iOS App
        run: |
          mkdir -p Payload/KurdExpenseApp.app
          if [ -d "KurdExpenseApp_iOS" ]; then
            cd KurdExpenseApp_iOS
            mkdir -p Payload/KurdExpenseApp.app
            cp -r * Payload/KurdExpenseApp.app/ 2>/dev/null || true
            zip -r ../KurdExpenseApp.ipa Payload
            cd ..
          else
            cp -r * Payload/KurdExpenseApp.app/ 2>/dev/null || true
            zip -r KurdExpenseApp.ipa Payload
          fi
          echo "IPA build completed successfully!"

      - name: 📤 Upload Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: KurdExpenseApp-iOS-IPA
          path: "*.ipa"
          retention-days: 14
